board_build.arduino.memory_type = ${common.board_build.arduino.memory_type}
build_src_filter = +<02-display/src/>
lib_deps = bodmer/TFT_eSPI@2.5.43
build_flags =
    ${common.build_flags}
    -D FNK0104B_ENABLE_DISPLAY=1

