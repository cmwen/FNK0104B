name: Build firmware and publish board guide

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firmware-plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Fingerprint firmware inputs
        id: plan
        run: echo "matrix=$(python scripts/firmware_ci.py plan)" >> "$GITHUB_OUTPUT"

  firmware:
    needs: firmware-plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.firmware-plan.outputs.matrix) }}
    env:
      PLATFORMIO_SETTING_ENABLE_TELEMETRY: 'No'
      ENVIRONMENT: ${{ matrix.environment }}
      FINGERPRINT: ${{ matrix.fingerprint }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Restore exact firmware bundle
        id: firmware-cache
        uses: actions/cache/restore@v6
        with:
          path: .ci/firmware/${{ matrix.environment }}
          key: ${{ runner.os }}-firmware-v1-${{ matrix.environment }}-${{ matrix.fingerprint }}
      - name: Verify cached images
        id: verified
        run: |
          if python scripts/firmware_ci.py verify --environment "$ENVIRONMENT" --fingerprint "$FINGERPRINT"; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Restore PlatformIO downloads
        if: steps.verified.outputs.ready != 'true'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-downloads-${{ matrix.download_group }}-${{ hashFiles('platformio.ini') }}
          restore-keys: ${{ runner.os }}-pio-downloads-${{ matrix.download_group }}-
      - name: Build changed or uncached environment
        if: steps.verified.outputs.ready != 'true'
        run: |
          python -m pip install 'platformio==6.2.0'
          pio run -e "$ENVIRONMENT"
          python scripts/firmware_ci.py collect --environment "$ENVIRONMENT" --fingerprint "$FINGERPRINT"
      - name: Save verified firmware bundle
        if: steps.verified.outputs.ready != 'true' && steps.firmware-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .ci/firmware/${{ matrix.environment }}
          key: ${{ steps.firmware-cache.outputs.cache-primary-key }}
      - name: Hand firmware to the packager
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.environment }}
          path: .ci/firmware/
          retention-days: 1
          include-hidden-files: true
          if-no-files-found: error

  checks:
    runs-on: ubuntu-latest
    env:
      PLATFORMIO_SETTING_ENABLE_TELEMETRY: 'No'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-native-${{ hashFiles('platformio.ini') }}
      - name: Run host tests
        run: |
          python -m pip install 'platformio==6.2.0'
          pio test -e native
          python -m unittest discover -s test/host
          python -m unittest discover -s monitor-server/tests

  platformio:
    needs: [firmware, checks]
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            web-flasher/package-lock.json
            site/package-lock.json
      - name: Build BLE setup page
        run: npm ci --prefix web-flasher && npm test --prefix web-flasher && npm run build --prefix web-flasher
      - name: Build and verify Astro guide
        run: npm ci --prefix site && npm run build --prefix site && npm test --prefix site
      - name: Assemble complete firmware catalog
        uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          path: .ci/firmware/
          merge-multiple: true
      - name: Package flasher and firmware
        run: python scripts/package_web_firmware.py --reuse-dir .ci/firmware --output /tmp/fnk0104b-pages
      - name: Verify links in the final Pages artifact
        run: GUIDE_DIST_DIR=/tmp/fnk0104b-pages npm test --prefix site
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: /tmp/fnk0104b-pages

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: platformio
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
