name: Build firmware and publish board guide

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  platformio:
    runs-on: ubuntu-latest
    env:
      PLATFORMIO_SETTING_ENABLE_TELEMETRY: 'No'
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            web-flasher/package-lock.json
            site/package-lock.json
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: ${{ runner.os }}-pio-
      - name: Install PlatformIO Core
        run: python -m pip install 'platformio==6.2.0'
      - name: Build firmware apps
        run: python scripts/build_firmware.py
      - name: Run host tests
        run: |
          pio test -e native
          python -m unittest discover -s test/host
          python -m unittest discover -s monitor-server/tests
      - name: Build BLE setup page
        run: npm ci --prefix web-flasher && npm test --prefix web-flasher && npm run build --prefix web-flasher
      - name: Build and verify Astro guide
        run: npm ci --prefix site && npm run build --prefix site && npm test --prefix site
      - name: Package flasher and firmware
        run: python scripts/package_web_firmware.py --output /tmp/fnk0104b-pages
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: /tmp/fnk0104b-pages

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: platformio
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
