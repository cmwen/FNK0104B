name: Build and native tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  platformio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: ${{ runner.os }}-pio-
      - name: Install PlatformIO Core
        run: python -m pip install 'platformio==6.2.0'
      - name: Build firmware apps
        run: pio run -e hello -e hello-debug -e display -e touch -e wifi -e nvs -e sd -e mqtt -e ota -e codex-monitor
      - name: Run host tests
        run: pio test -e native
