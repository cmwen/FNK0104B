name: Build firmware

on:
  push:
    paths:
      - 'platformio.ini'
      - 'CMakeLists.txt'
      - 'dependencies*.lock'
      - 'apps/**'
      - '!apps/**/*.md'
      - 'lib/**'
      - '!lib/**/*.md'
      - 'components/**'
      - '!components/**/*.md'
      - 'scripts/**'
      - '!scripts/**/*.md'
      - '!scripts/capture_monitor_screen.py'
      - '!scripts/monitor_ui_preview.cpp'
      - '!scripts/fetch_firmware_catalog.py'
      - '.github/workflows/firmware.yml'
  pull_request:
    paths:
      - 'platformio.ini'
      - 'CMakeLists.txt'
      - 'dependencies*.lock'
      - 'apps/**'
      - '!apps/**/*.md'
      - 'lib/**'
      - '!lib/**/*.md'
      - 'components/**'
      - '!components/**/*.md'
      - 'scripts/**'
      - '!scripts/**/*.md'
      - '!scripts/capture_monitor_screen.py'
      - '!scripts/monitor_ui_preview.cpp'
      - '!scripts/fetch_firmware_catalog.py'
      - '.github/workflows/firmware.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  firmware-plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Fingerprint firmware inputs
        id: plan
        run: echo "matrix=$(python scripts/firmware_ci.py plan)" >> "$GITHUB_OUTPUT"

  firmware:
    needs: firmware-plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.firmware-plan.outputs.matrix) }}
    env:
      PLATFORMIO_SETTING_ENABLE_TELEMETRY: 'No'
      ENVIRONMENT: ${{ matrix.environment }}
      FINGERPRINT: ${{ matrix.fingerprint }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Restore exact firmware bundle
        id: firmware-cache
        uses: actions/cache/restore@v6
        with:
          path: .ci/firmware/${{ matrix.environment }}
          key: ${{ runner.os }}-firmware-v1-${{ matrix.environment }}-${{ matrix.fingerprint }}
      - name: Verify cached images
        id: verified
        run: |
          if python scripts/firmware_ci.py verify --environment "$ENVIRONMENT" --fingerprint "$FINGERPRINT"; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Restore PlatformIO downloads
        if: steps.verified.outputs.ready != 'true'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-downloads-${{ matrix.download_group }}-${{ hashFiles('platformio.ini') }}
          restore-keys: ${{ runner.os }}-pio-downloads-${{ matrix.download_group }}-
      - name: Build changed or uncached environment
        if: steps.verified.outputs.ready != 'true'
        run: |
          python -m pip install 'platformio==6.2.0'
          pio run -e "$ENVIRONMENT"
          python scripts/firmware_ci.py collect --environment "$ENVIRONMENT" --fingerprint "$FINGERPRINT"
      - name: Save verified firmware bundle
        if: steps.verified.outputs.ready != 'true' && steps.firmware-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .ci/firmware/${{ matrix.environment }}
          key: ${{ steps.firmware-cache.outputs.cache-primary-key }}
      - name: Hand firmware to the packager
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.environment }}
          path: .ci/firmware/
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: error

  catalog:
    needs: [firmware, checks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          path: .ci/firmware/
          merge-multiple: true
      - name: Verify complete catalog
        run: |
          python - <<'PYTHON'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from firmware_ci import verify
          from package_web_firmware import firmware_environments
          for environment in firmware_environments():
              verify(Path('.ci/firmware'), environment)
          PYTHON
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-catalog
          path: .ci/firmware/
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error
