name: Host checks

on:
  push:
    paths:
      - 'monitor-server/**'
      - '!monitor-server/**/*.md'
      - 'scripts/fetch_firmware_catalog.py'
      - 'scripts/monitor_ui_preview.cpp'
      - 'scripts/capture_monitor_screen.py'
      - 'test/**'
      - '!test/hardware/**'
      - '!test/**/*.md'
      - '.github/workflows/checks.yml'
  pull_request:
    paths:
      - 'monitor-server/**'
      - '!monitor-server/**/*.md'
      - 'scripts/fetch_firmware_catalog.py'
      - 'scripts/monitor_ui_preview.cpp'
      - 'scripts/capture_monitor_screen.py'
      - 'test/**'
      - '!test/hardware/**'
      - '!test/**/*.md'
      - '.github/workflows/checks.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      PLATFORMIO_SETTING_ENABLE_TELEMETRY: 'No'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-native-${{ hashFiles('platformio.ini') }}
      - name: Run host tests
        run: |
          python -m pip install 'platformio==6.2.0'
          pio test -e native
          python -m unittest discover -s test/host
          python -m unittest discover -s monitor-server/tests
